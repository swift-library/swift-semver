name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: swift-library/github-workflows/.github/workflows/swift-package.yml@37ca96825daa6c5517bb118a233449dd564b4869
  release:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/github-workflows/.github/workflows/swift-package-release.yml@37ca96825daa6c5517bb118a233449dd564b4869
    with:
      tag: ${{ github.ref_name }}
      accepted_commit: ${{ github.sha }}
