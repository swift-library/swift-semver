name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: swift-library/.github/.github/workflows/policy.yml@5798f6f4603cc8b25e3f198fd53c33869be51f9a
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@5798f6f4603cc8b25e3f198fd53c33869be51f9a
