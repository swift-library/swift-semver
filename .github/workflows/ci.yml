name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: swift-library/.github/.github/workflows/policy.yml@c78fc385d51fa49d4adf9782c6689198064c9d9a
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@c78fc385d51fa49d4adf9782c6689198064c9d9a
