name: Source policy
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  policy:
    uses: swift-library/github-workflows/.github/workflows/policy.yml@37ca96825daa6c5517bb118a233449dd564b4869
